

<table border='1' id="data">
	<tr>
		<th>ID</th>
		<th>User Id</th>
		<th>Title</th>
		<th>Body</th>
	</tr>
	
</table>


<script>

	var mydiv=document.getElementById('data');
	function show(obj){
		for(data of obj)
		{
			var html=`<tr>
						<th>${data.id}</th>
						<th>${data.userId}</th>
						<th>${data.title}</th>
						<th>${data.body}</th>
					</tr>`;
			mydiv.insertAdjacentHTML('beforeend',html);			
		}
	}
	
	fetch(`https://jsonplaceholder.typicode.com/posts`)
	.then((res)=>res.json())
	.then((myobj)=> show(myobj)) //console.log(myobj));
	
	
</script>
